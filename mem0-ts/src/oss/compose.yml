services:
  neo4j:
    image: neo4j:community # https://hub.docker.com/_/neo4j/
    tty: true
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - ./tmp/neo4j/data:/data
      - ./tmp/neo4j/logs:/logs
      - ./tmp/neo4j/conf:/conf
      - ./tmp/neo4j/certs:/var/lib/neo4j/certificates/bolt
    environment:
      - NEO4J_AUTH=none

  opensearch:
    build:
      context: .
      dockerfile: Dockerfile-opensearch
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9200:9200
      - 9600:9600
    volumes:
      - ./tmp/opensearch/data:/usr/share/opensearch/data